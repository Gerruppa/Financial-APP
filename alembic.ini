# Used only by the alembic CLI; generate a migration with scripts/new_migration.py, which runs it on a scratch database.
# The app itself runs migrations at start-up (financial_app.persistence.db.init_db).
[alembic]
script_location = %(here)s/src/financial_app/persistence/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

# A new revision gets the repo's import order and formatting, so pre-commit and CI pass on it as generated
[post_write_hooks]
hooks = ruff_check, ruff_format
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
