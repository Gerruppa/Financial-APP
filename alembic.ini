# Used only by the alembic CLI, e.g.:
#   .venv/Scripts/python.exe -m alembic revision --autogenerate -m "add accounts"
# The app itself runs migrations at start-up (financial_app.persistence.db.init_db).
[alembic]
script_location = %(here)s/src/financial_app/persistence/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
