[project]
name = "kapita"
dynamic = ["version"]
description = "KAPITA: personal investment tracker (re-implementation of the inwestomat.eu Portfolio tracker sheet)"
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.18",
    "pywebview>=6.2",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "platformdirs>=4.12",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "mypy>=2.4",
    "ruff>=0.16",
    "types-xlrd",
]
# Builds the Windows installer (scripts/build_installer.ps1) and the icons (scripts/make_icons.py)
build = [
    "pyinstaller>=6.16",
    "pillow>=11",
]

[project.scripts]
kapita = "financial_app.app:main"

# No console window: this is what the desktop shortcut starts.
[project.gui-scripts]
kapita-gui = "financial_app.app:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "financial_app.__version__" }

[tool.setuptools.package-data]
financial_app = ["persistence/migrations/*.py", "persistence/migrations/versions/*.py", "ui/*.md", "ui/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["webview.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
