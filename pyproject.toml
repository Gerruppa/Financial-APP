[project]
name = "financial-app"
version = "0.1.0"
description = "Personal investment tracker (re-implementation of the inwestomat.eu Portfolio tracker sheet)"
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.18",
    "pywebview>=6.2",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "platformdirs>=4.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "mypy>=2.4",
    "ruff>=0.16",
]

[project.scripts]
financial-app = "financial_app.app:main"

# No console window: this is what the desktop shortcut starts.
[project.gui-scripts]
financial-app-gui = "financial_app.app:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financial_app = ["persistence/migrations/*.py", "persistence/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["webview.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
