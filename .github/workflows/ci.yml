name: CI

# The full suite on main. A solo project checks each change locally (pre-commit runs ruff and mypy, the full suite
# runs before each commit), so CI runs when a milestone closes, on a release tag and on demand.
on:
  milestone:
    types: [closed]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    # The app is Windows-only (pywebview, the installer), so the checks run where it runs.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      # A hung test fails with its stack trace instead of running into the job timeout.
      - run: python -m pytest -n auto --timeout=300
